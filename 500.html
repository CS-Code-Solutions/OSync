<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 | Instabilidade Temporária - OSync</title>
    <link rel="icon" type="image/png" href="images/ico.png">
    <meta name="theme-color" content="#0B1120">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0B1120] text-slate-200 min-h-screen flex flex-col justify-between">

    <!-- CABEÇALHO -->
    <header class="px-6 h-16 flex items-center justify-between border-b border-slate-800/80">
        <a href="index.html" class="flex items-center gap-2">
            <img src="images/cabe.png" alt="OSync" class="h-9 w-auto object-contain">
        </a>
        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-amber-500/10 text-amber-400 border border-amber-500/30">
            <span class="w-2 h-2 rounded-full bg-amber-400"></span>
            <span>Manutenção / Instabilidade</span>
        </span>
    </header>

    <!-- CONTEÚDO CENTRAL -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-[#131C31] border border-slate-800 rounded-2xl p-8 text-center shadow-2xl space-y-5">
            <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 flex items-center justify-center">
                <i data-lucide="server-crash" class="w-8 h-8"></i>
            </div>

            <div class="space-y-2">
                <span class="text-xs font-extrabold uppercase tracking-widest text-rose-400">Erro 500</span>
                <h1 class="text-2xl font-extrabold text-white">Instabilidade temporária</h1>
                <p class="text-sm text-slate-400 leading-relaxed">
                    Ocorreu uma falha inesperada ao processar sua solicitação. Seus dados estão seguros — tente recarregar o sistema em alguns segundos.
                </p>
            </div>

            <div class="pt-2 flex flex-col sm:flex-row gap-2.5">
                <button type="button" onclick="window.location.reload()"
                        class="flex-1 bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-extrabold text-xs py-3 px-4 rounded-xl transition flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Tentar Novamente</span>
                </button>
                <a href="index.html"
                   class="flex-1 bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs py-3 px-4 rounded-xl border border-slate-700 transition flex items-center justify-center gap-2">
                    <i data-lucide="home" class="w-4 h-4"></i>
                    <span>Início</span>
                </a>
            </div>
        </div>
    </main>

    <!-- RODAPÉ -->
    <footer class="bg-[#0B1120] text-slate-400 text-xs py-3.5 text-center border-t border-slate-800">
        © 2026 OSync • <a href="pages/privacidade.html" class="hover:text-[#00E5B0] underline transition">Política de Privacidade e LGPD</a> | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" rel="noopener noreferrer" class="font-semibold text-[#00E5B0] hover:underline">CS Code Solutions</a>
    </footer>

    <script>
        if (typeof lucide !== 'undefined') lucide.createIcons();
    </script>
</body>
</html>
