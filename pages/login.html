<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSync | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#0B1120] text-white">

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#131C31] w-full max-w-md rounded-2xl shadow-2xl border border-slate-800 p-8">
            <!-- Logo OSync -->
            <div class="flex flex-col items-center mb-8">
                <div class="flex items-center gap-2.5 mb-2">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-blue-600 to-[#00E5B0] flex items-center justify-center text-[#0B1120] shadow-lg shadow-cyan-500/20">
                        <i data-lucide="refresh-cw" class="w-6 h-6 stroke-[2.5]"></i>
                    </div>
                    <span class="text-3xl font-extrabold tracking-tight text-white">OS<span class="text-[#00E5B0]">ync</span></span>
                </div>
                <p class="text-xs uppercase tracking-widest text-slate-400">Gestão de Ordens de Serviço</p>
            </div>

            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">E-mail de Acesso</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="email" id="email" required placeholder="usuario@empresa.com"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-950/60 border border-rose-800 p-3 rounded-lg"></div>

                <button type="submit" id="btn-login"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 mt-2">
                    <span>Acessar Sistema</span>
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- Rodapé Oficial -->
    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-800/80">
        © 2026 OSync | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" class="font-semibold text-[#00E5B0] hover:underline">CS Code Solutions</a>
    </footer>

    <script src="../js/supabase-config.js"></script>
    <script>
        lucide.createIcons();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorBox = document.getElementById('login-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Entrando...</span>';
            errorBox.classList.add('hidden');

            const { error } = await db.auth.signInWithPassword({ email, password });

            if (error) {
                errorBox.textContent = 'E-mail ou senha incorretos.';
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Acessar Sistema</span><i data-lucide="log-in" class="w-4 h-4"></i>';
                lucide.createIcons();
            } else {
                window.location.href = '../index.html';
            }
        });
    </script>
</body>
</html>
