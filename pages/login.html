<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSync | Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="min-h-screen flex flex-col justify-between bg-[#0B1120] text-white">

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#131C31] w-full max-w-md rounded-2xl shadow-2xl border border-slate-800 p-8">
            <!-- Logo OSync -->
            <div class="flex flex-col items-center mb-8">
                <div class="flex items-center gap-2.5 mb-2">
                    <div class="w-11 h-11 rounded-xl bg-gradient-to-tr from-blue-600 to-[#00E5B0] flex items-center justify-center text-[#0B1120] shadow-lg shadow-cyan-500/20">
                        <i data-lucide="refresh-cw" class="w-6 h-6 stroke-[2.5]"></i>
                    </div>
                    <span class="text-3xl font-extrabold tracking-tight text-white">OS<span class="text-[#00E5B0]">ync</span></span>
                </div>
                <p class="text-xs uppercase tracking-widest text-slate-400">Gestão de Ordens de Serviço</p>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">E-mail de Acesso</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="email" id="email" required placeholder="usuario@empresa.com"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-950/60 border border-rose-800 p-3 rounded-lg"></div>
                <div id="login-success" class="hidden text-xs text-[#00E5B0] bg-emerald-950/60 border border-[#00E5B0]/40 p-3 rounded-lg"></div>

                <button type="submit" id="btn-login"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 mt-2">
                    <span>Acessar Sistema</span>
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                </button>

                <div class="text-center pt-2">
                    <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-400 hover:text-[#00E5B0] transition">
                        Não tem acesso? Solicitar cadastro ao Gestor
                    </button>
                </div>
            </form>

            <!-- FORMULÁRIO DE SOLICITAÇÃO DE ACESSO (AGUARDA LIBERAÇÃO DO GESTOR) -->
            <form id="register-form" class="hidden space-y-3.5">
                <div class="bg-[#0B1120] border border-slate-700/80 p-3 rounded-xl text-xs text-slate-300">
                    Preencha seus dados abaixo. Seu acesso ficará <strong>pendente</strong> até a aprovação do gestor da empresa.
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Código da Empresa *</label>
                    <input type="text" id="reg-empresa-id" required placeholder="Cole o código fornecido pelo gestor"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Seu Nome Completo *</label>
                    <input type="text" id="reg-nome" required placeholder="Ex: João Silva"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Função *</label>
                        <select id="reg-perfil" class="w-full px-3 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                            <option value="Manutentor">Manutentor</option>
                            <option value="Lideranca">Liderança</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Setor / Área *</label>
                        <input type="text" id="reg-setor" required placeholder="Ex: Mecânica"
                            class="w-full px-3 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Seu E-mail *</label>
                    <input type="email" id="reg-email" required placeholder="seu.email@empresa.com"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Crie uma Senha (mín. 6 dígitos) *</label>
                    <input type="password" id="reg-senha" required minlength="6" placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120] border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div id="reg-error" class="hidden text-xs text-rose-400 bg-rose-950/60 border border-rose-800 p-3 rounded-lg"></div>

                <button type="submit" id="btn-register"
                    class="w-full bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold py-3 rounded-xl transition">
                    Enviar Solicitação de Acesso
                </button>
                <div class="text-center pt-1">
                    <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-400 hover:text-white">
                        Voltar para o Login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-800/80">
        © 2026 OSync | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" class="font-semibold text-[#00E5B0] hover:underline">CS Code Solutions</a>
    </footer>

    <script src="../js/firebase-config.js"></script>
    <script>
        lucide.createIcons();

        function alternarModoCadastro() {
            document.getElementById('login-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('login-error').classList.add('hidden');
            document.getElementById('login-success').classList.add('hidden');
            document.getElementById('reg-error').classList.add('hidden');
        }

        // Login
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorBox = document.getElementById('login-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';
            errorBox.classList.add('hidden');

            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                const doc = await db.collection('usuarios').doc(cred.user.uid).get();

                if (!doc.exists) {
                    await auth.signOut();
                    throw new Error('Cadastro não encontrado ou excluído pelo gestor.');
                }

                const dados = doc.data();
                if (dados.statusAcesso === 'pendente') {
                    await auth.signOut();
                    throw new Error('Sua solicitação ainda está aguardando aprovação do gestor.');
                }

                if (dados.ativo === false) {
                    await auth.signOut();
                    throw new Error('Seu acesso foi desativado pelo administrador.');
                }

                window.location.href = '../index.html';
            } catch (err) {
                errorBox.textContent = err.message.includes('auth/') ? 'E-mail ou senha inválidos.' : err.message;
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Acessar Sistema</span><i data-lucide="log-in" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        });

        // Enviar Solicitação de Cadastro (NÃO libera login automático)
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const errorBox = document.getElementById('reg-error');
            btn.disabled = true;
            btn.textContent = 'Enviando solicitação...';
            errorBox.classList.add('hidden');

            try {
                const empresaId = document.getElementById('reg-empresa-id').value.trim();
                const nome = document.getElementById('reg-nome').value.trim();
                const perfil = document.getElementById('reg-perfil').value;
                const setor = document.getElementById('reg-setor').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const senha = document.getElementById('reg-senha').value;

 // 1. Verifica se o Código da Empresa existe
let empresaDoc;
try {
    empresaDoc = await db.collection('empresas').doc(empresaId).get();
} catch (errConsulta) {
    throw new Error('Permissão bloqueada ao validar empresa (verifique allow get: if true no Firestore).');
}

if (!empresaDoc.exists) {
    throw new Error('Código da Empresa não encontrado no banco. Confira o ID com o gestor.');
}


                // 2. Cria credencial no Auth
                const cred = await auth.createUserWithEmailAndPassword(email, senha);
                const uid = cred.user.uid;

                // 3. Registra no Firestore como PENDENTE e INATIVO
                await db.collection('usuarios').doc(uid).set({
                    empresaId: empresaId,
                    nome: nome,
                    email: email,
                    perfil: perfil,
                    setor: setor,
                    ativo: false,
                    statusAcesso: 'pendente',
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 4. Desloga imediatamente para impedir entrada automática
                await auth.signOut();

                e.target.reset();
                alternarModoCadastro();

                const successBox = document.getElementById('login-success');
                successBox.textContent = 'Solicitação enviada! Aguarde o gestor liberar seu acesso para entrar.';
                successBox.classList.remove('hidden');

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Solicitação de Acesso';
            }
        });
    </script>
</body>
</html>
