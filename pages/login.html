<head>

    <link rel="stylesheet" href="/css/style.css?v=2">
    <style>
        .bg--responsivo {
            background-color: #0B1120;
            background-image: url('/images/loginmob.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        @media (min-width: 768px) {
            .bg--responsivo {
                background-image: url('/images/loginpc.png');
            }
        }

        /* Efeito LED estilo NexOS na borda da caixa (responsivo ao mouse e toque) */
        .osync-led-card {
            background: rgba(11, 19, 43, 0.94);
            border: 1px solid rgba(0, 245, 212, 0.4);
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.55);
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
        }
        .osync-led-card:hover,
        .osync-led-card:active,
        .osync-led-card:focus-within {
            border-color: #00F5D4;
            box-shadow: 0 0 25px rgba(0, 245, 212, 0.5), 0 0 10px rgba(0, 245, 212, 0.2) inset;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg--responsivo text-white">

    <div id="osync-led-card" class="osync-led-card backdrop-blur-md w-full max-w-[340px] p-5">
        <!-- Logo OSync -->
        <div class="flex flex-col items-center mb-5">
            <img src="/images/log.png" alt="OSync" draggable="false" class="max-h-28 w-auto object-contain mb-1">
        </div>

        <!-- FORMULÁRIO DE LOGIN -->
        <form id="-form" class="space-y-3">
            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">E-mail de Acesso</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                    <input type="email" id="email" required placeholder="usuario@empresa.com"
                        class="w-full pl-9 pr-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-300 mb-1">Senha</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-9 pr-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                </div>
            </div>

            <div id="-error" class="hidden text-xs text-rose-400 bg-rose-950/80 border border-rose-800 p-2.5 rounded-lg"></div>
            <div id="-success" class="hidden text-xs text-[#00E5B0] bg-emerald-950/80 border border-[#00E5B0]/40 p-2.5 rounded-lg"></div>

            <button type="submit" id="btn-"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 mt-1 text-sm">
                <span>Acessar Sistema</span>
                <i data-lucide="log-in" class="w-4 h-4"></i>
            </button>

            <!-- BOTÃO DE LOGIN BIOMÉTRICO (PASSKEY / DIGITAL / FACE ID) -->
            <div id="box-btn-biometria" class="hidden pt-1">
                <button type="button" id="btn-login-biometria" onclick="entrarComBiometria()"
                    class="w-full bg-[#0B1120]/90 hover:bg-[#00F5D4]/15 text-[#00F5D4] border border-[#00F5D4]/60 font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-xs shadow-sm">
                    <i data-lucide="fingerprint" class="w-4 h-4 shrink-0"></i>
                    <span id="texto-btn-biometria">Entrar com Digital / Face ID</span>
                </button>
            </div>

            <div class="text-center pt-1.5">
                <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-300 hover:text-[#00E5B0] transition">
                    Não tem acesso? Solicitar cadastro ao Gestor
                </button>
            </div>
        </form>

        <!-- FORMULÁRIO DE SOLICITAÇÃO DE ACESSO (AGUARDA LIBERAÇÃO DO GESTOR) -->
        <form id="register-form" class="hidden space-y-2.5">
            <div class="bg-[#0B1120]/90 border border-slate-700/80 p-2.5 rounded-xl text-[11px] text-slate-300">
                Preencha seus dados abaixo. Seu acesso ficará <strong>pendente</strong> até a aprovação do gestor da empresa.
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Código da Empresa *</label>
                <input type="text" id="reg-empresa-id" required maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false"
                    placeholder="Cole o código fornecido pelo gestor"
                    class="w-full px-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs font-mono tracking-wide text-white focus:border-[#00E5B0] outline-none">
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Seu Nome Completo *</label>
                <input type="text" id="reg-nome" required maxlength="100" placeholder="Ex: João Silva"
                    class="w-full px-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs text-white focus:border-[#00E5B0] outline-none">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Função *</label>
                    <select id="reg-perfil" class="w-full px-2.5 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs text-white focus:border-[#00E5B0] outline-none">
                        <option value="Manutentor">Manutentor</option>
                        <option value="Lideranca">Liderança</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Setor / Área *</label>
                    <input type="text" id="reg-setor" required maxlength="80" placeholder="Ex: Mecânica"
                        class="w-full px-2.5 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs text-white focus:border-[#00E5B0] outline-none">
                </div>
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Seu E-mail *</label>
                <input type="email" id="reg-email" required maxlength="120" placeholder="seu.email@empresa.com"
                    class="w-full px-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs text-white focus:border-[#00E5B0] outline-none">
            </div>

            <div>
                <label class="block text-[11px] font-semibold text-slate-300 mb-0.5">Crie uma Senha (mín. 6 dígitos) *</label>
                <input type="password" id="reg-senha" required minlength="6" maxlength="128" placeholder="••••••••"
                    class="w-full px-3 py-2 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-xs text-white focus:border-[#00E5B0] outline-none">
            </div>

            <!-- ACEITE OBRIGATÓRIO LGPD (NUNCA PRÉ-MARCADO) -->
            <label class="flex items-start gap-2 p-2.5 rounded-xl bg-[#0B1120]/80 border border-slate-700 cursor-pointer hover:border-[#00E5B0]/60 transition select-none">
                <input type="checkbox" id="reg-lgpd-aceite" required
                    class="mt-0.5 w-3.5 h-3.5 accent-[#00E5B0] rounded cursor-pointer shrink-0">
                <span class="text-[10px] text-slate-300 leading-relaxed">
                    Li e concordo com a <a href="/pages/privacidade.html" target="_blank" rel="noopener noreferrer" class="text-[#00E5B0] font-bold underline hover:opacity-80">Política de Privacidade e Termos de Uso</a> e autorizo a coleta dos meus dados para gestão de manutenção (LGPD).
                </span>
            </label>

            <div id="reg-error" class="hidden text-xs text-rose-400 bg-rose-950/80 border border-rose-800 p-2.5 rounded-lg"></div>

            <button type="submit" id="btn-register"
                class="w-full bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold py-2.5 rounded-xl transition text-sm">
                Enviar Solicitação de Acesso
            </button>
            <div class="text-center pt-1">
                <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-300 hover:text-white">
                    Voltar para o login
                </button>
            </div>
        </form>

        <div class="mt-4 pt-3 border-t border-slate-800/70 text-center text-[11px] text-slate-400">
            &copy; 2026 | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" rel="noopener noreferrer" class="font-semibold text-[#00F5D4] hover:underline">CS Code Solutions</a>
        </div>
    </div>

    <script src="/js/firebase-config.js"></script>
    <script>
        lucide.createIcons();

        function bufferParaBase64UrlLogin(buffer) {
            const bytes = new Uint8Array(buffer);
            let binario = '';
            for (let i = 0; i < bytes.byteLength; i++) {
                binario += String.fromCharCode(bytes[i]);
            }
            return btoa(binario).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
        }

        function base64UrlParaUint8ArrayLogin(base64url) {
            const base64 = String(base64url || '').replace(/-/g, '+').replace(/_/g, '/');
            const pad = base64.length % 4 ? '='.repeat(4 - (base64.length % 4)) : '';
            const binario = atob(base64 + pad);
            const bytes = new Uint8Array(binario.length);
            for (let i = 0; i < binario.length; i++) {
                bytes[i] = binario.charCodeAt(i);
            }
            return bytes;
        }

        function obterPasskeyLocalLogin() {
            try {
                const bruto = localStorage.getItem('osync_passkey_meta');
                return bruto ? JSON.parse(bruto) : null;
            } catch (_) {
                return null;
            }
        }

        // Exibe botão de biometria se o dispositivo suportar WebAuthn
        (function inicializarBotaoBiometriaLogin() {
            if (!window.PublicKeyCredential) return;
            const box = document.getElementById('box-btn-biometria');
            const texto = document.getElementById('texto-btn-biometria');
            if (!box) return;

            box.classList.remove('hidden');
            const meta = obterPasskeyLocalLogin();
            if (meta && meta.nome && texto) {
                const primeiroNome = String(meta.nome).trim().split(' ')[0];
                texto.textContent = `Entrar com Digital (${primeiroNome})`;
            }
        })();

        async function entrarComBiometria() {
            const btnBio = document.getElementById('btn-login-biometria');
            const errorBox = document.getElementById('-error');
            if (!btnBio) return;

            btnBio.disabled = true;
            const htmlOriginal = btnBio.innerHTML;
            btnBio.innerHTML = '<span>Aguardando biometria...</span>';
            errorBox.classList.add('hidden');
            fazendoLoginManual = true;

            try {
                // 1. Solicita desafio criptográfico ao servidor
                const respChallenge = await fetch('/api/passkey', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'challenge' })
                });
                const dadosChallenge = await respChallenge.json();
                if (!respChallenge.ok) throw new Error(dadosChallenge.error || 'Erro ao iniciar verificação biométrica.');

                const meta = obterPasskeyLocalLogin();
                const publicKeyOptions = {
                    challenge: base64UrlParaUint8ArrayLogin(dadosChallenge.challenge),
                    rpId: dadosChallenge.rpId,
                    userVerification: 'required',
                    timeout: 60000
                };

                if (meta && meta.credentialId) {
                    publicKeyOptions.allowCredentials = [{
                        type: 'public-key',
                        id: base64UrlParaUint8ArrayLogin(meta.credentialId)
                    }];
                }

                // 2. Solicita leitura da digital / Face ID no aparelho
                const assertion = await navigator.credentials.get({ publicKey: publicKeyOptions });
                if (!assertion) throw new Error('Leitura biométrica cancelada.');

                const credentialId = bufferParaBase64UrlLogin(assertion.rawId);
                const clientDataJSON = bufferParaBase64UrlLogin(assertion.response.clientDataJSON);
                const authenticatorData = bufferParaBase64UrlLogin(assertion.response.authenticatorData);
                const signature = bufferParaBase64UrlLogin(assertion.response.signature);

                // 3. Valida assinatura na Vercel e obtém Firebase Custom Token
                const respAuth = await fetch('/api/passkey', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'authenticate',
                        credentialId,
                        clientDataJSON,
                        authenticatorData,
                        signature
                    })
                });

                const dadosAuth = await respAuth.json();
                if (!respAuth.ok) {
                    if (respAuth.status === 404) {
                        localStorage.removeItem('osync_passkey_meta');
                    }
                    throw new Error(dadosAuth.error || 'Falha na validação biométrica.');
                }

                // 4. Autentica no Firebase Auth com o Custom Token oficial
                await auth.signInWithCustomToken(dadosAuth.customToken);
                window.location.replace('/');
            } catch (err) {
                fazendoLoginManual = false;
                if (err.name === 'NotAllowedError') {
                    errorBox.textContent = 'Leitura biométrica cancelada ou nenhuma chave encontrada neste aparelho.';
                } else {
                    errorBox.textContent = err.message;
                }
                errorBox.classList.remove('hidden');
                btnBio.disabled = false;
                btnBio.innerHTML = htmlOriginal;
                lucide.createIcons();
            }
        }

        function restaurarBotaoLogin() {
            const btn = document.getElementById('btn-');
            if (!btn) return;
            btn.disabled = false;
            btn.innerHTML = '<span>Acessar Sistema</span><i data-lucide="log-in" class="w-4 h-4"></i>';
            lucide.createIcons();
        }

        // Evita botão travado em "Verificando..." se o usuário voltar pelo cache do navegador (bfcache)
        window.addEventListener('pageshow', () => {
            restaurarBotaoLogin();
            if (auth && auth.currentUser) {
                window.location.replace('/');
            }
        });

        // Se já houver sessão ativa válida no Firebase, entra direto no sistema
        let fazendoLoginManual = false;
        auth.onAuthStateChanged(async (user) => {
            if (!user || fazendoLoginManual) return;
            try {
                const doc = await db.collection('usuarios').doc(user.uid).get();
                if (doc.exists && doc.data().ativo !== false && doc.data().statusAcesso !== 'pendente') {
                    window.location.replace('/');
                }
            } catch (_) {}
        });

        // Blindagem contra menu nativo de toque longo, cópia e arraste de imagens/textos
        (function ativarBlindagem() {
            const ehCampoEditavel = (el) => {
                if (!el) return false;
                const tag = el.tagName;
                return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
            };

            document.addEventListener('contextmenu', (e) => {
                if (!ehCampoEditavel(e.target)) e.preventDefault();
            });

            document.addEventListener('dragstart', (e) => {
                if (e.target && e.target.tagName === 'IMG') e.preventDefault();
            });

            document.addEventListener('copy', (e) => {
                if (!ehCampoEditavel(document.activeElement)) e.preventDefault();
            });

            document.addEventListener('cut', (e) => {
                if (!ehCampoEditavel(document.activeElement)) e.preventDefault();
            });
        })();

        function alternarModoCadastro() {
            document.getElementById('-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('-error').classList.add('hidden');
            document.getElementById('-success').classList.add('hidden');
            document.getElementById('reg-error').classList.add('hidden');
        }

        // Se abrir o link de convite com ?empresa=ID, já abre direto no formulário de cadastro preenchido
        (function verificarConviteUrl() {
            const params = new URLSearchParams(window.location.search);
            const empConvite = (params.get('empresa') || '').replace(/[\s\u200B-\u200D\uFEFF]/g, '');
            if (empConvite) {
                const inputEmp = document.getElementById('reg-empresa-id');
                if (inputEmp) inputEmp.value = empConvite;
                if (document.getElementById('register-form')?.classList.contains('hidden')) {
                    alternarModoCadastro();
                }
            }
        })();

        document.getElementById('-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-');
            const errorBox = document.getElementById('-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            fazendoLoginManual = true;
            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';
            errorBox.classList.add('hidden');

            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                const doc = await db.collection('usuarios').doc(cred.user.uid).get();

                if (!doc.exists) {
                    await auth.signOut();
                    throw new Error('Cadastro não encontrado ou excluído pelo gestor.');
                }

                const dados = doc.data();
                if (dados.statusAcesso === 'pendente') {
                    await auth.signOut();
                    throw new Error('Sua solicitação ainda está aguardando aprovação do gestor.');
                }

                if (dados.ativo === false) {
                    await auth.signOut();
                    throw new Error('Seu acesso foi desativado pelo administrador.');
                }

                window.location.replace('/');
            } catch (err) {
                fazendoLoginManual = false;
                errorBox.textContent = err.message.includes('auth/') ? 'E-mail ou senha inválidos.' : err.message;
                errorBox.classList.remove('hidden');
                restaurarBotaoLogin();
            }
        });

        // Enviar Solicitação de Cadastro + Registro de Aceite LGPD + Push para Gestão
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const errorBox = document.getElementById('reg-error');
            btn.disabled = true;
            btn.textContent = 'Enviando solicitação...';
            errorBox.classList.add('hidden');

            try {
                const aceiteLgpd = document.getElementById('reg-lgpd-aceite')?.checked;
                if (!aceiteLgpd) {
                    throw new Error('É obrigatório aceitar a Política de Privacidade (LGPD) para solicitar acesso.');
                }

                // Remove espaços e caracteres invisíveis de cópia do WhatsApp
                const empresaId = document.getElementById('reg-empresa-id').value.replace(/[\s\u200B-\u200D\uFEFF]/g, '');
                document.getElementById('reg-empresa-id').value = empresaId;

                if (!/^[a-zA-Z0-9_-]{6,60}$/.test(empresaId)) {
                    throw new Error('Formato de Código da Empresa inválido.');
                }

                const nome = document.getElementById('reg-nome').value.trim();
                const perfilSelecionado = document.getElementById('reg-perfil').value;
                const perfil = (perfilSelecionado === 'Manutentor' || perfilSelecionado === 'Lideranca') ? perfilSelecionado : 'Manutentor';
                const setor = document.getElementById('reg-setor').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const senha = document.getElementById('reg-senha').value;

                // 1. Verifica se o Código da Empresa existe
                let empresaDoc;
                try {
                    empresaDoc = await db.collection('empresas').doc(empresaId).get();
                } catch (errConsulta) {
                    throw new Error('Permissão bloqueada ao validar empresa.');
                }

                if (!empresaDoc.exists) {
                    throw new Error('Código da Empresa não encontrado. Verifique maiúsculas/minúsculas ou peça o link de convite ao gestor.');
                }

                // 2. Cria credencial no Auth
                const cred = await auth.createUserWithEmailAndPassword(email, senha);
                const uid = cred.user.uid;

                // 3. Registra no Firestore como PENDENTE e INATIVO
                await db.collection('usuarios').doc(uid).set({
                    empresaId: empresaId,
                    nome: nome,
                    email: email,
                    perfil: perfil,
                    setor: setor,
                    ativo: false,
                    statusAcesso: 'pendente',
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 4. Registra o aceite formal da Política de Privacidade (LGPD)
                await db.collection('termos_aceites').doc(uid).set({
                    aceito: true,
                    versao: '1.0',
                    nome: nome,
                    email: email,
                    empresaId: empresaId,
                    dataAceite: firebase.firestore.FieldValue.serverTimestamp(),
                    userAgent: navigator.userAgent || ''
                });

                // 5. Notifica a Gestão via Push antes de encerrar sessão
                await fetch('/api/notificar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: 'novo_cadastro',
                        empresaId: empresaId,
                        remetenteUid: uid,
                        perfisAlvo: ['Admin'],
                        titulo: 'Nova Solicitação de Cadastro',
                        corpo: `${nome} (${perfil} - ${setor}) solicitou acesso ao sistema.`,
                        urlDestino: '/'
                    })
                }).catch(() => {});

                // 6. Desloga imediatamente para impedir entrada automática
                await auth.signOut();

                e.target.reset();
                alternarModoCadastro();

                const successBox = document.getElementById('-success');
                successBox.textContent = 'Solicitação enviada! Aguarde o gestor liberar seu acesso para entrar.';
                successBox.classList.remove('hidden');

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Solicitação de Acesso';
            }
        });
