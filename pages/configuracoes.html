<div class="space-y-6">
    <!-- Cabeçalho da Página -->
    <div>
        <h1 class="text-2xl font-bold text-slate-900">Configurações do Sistema</h1>
        <p class="text-sm text-slate-500">Gerencie colunas do quadro Kanban, tipos de manutenção e setores executantes.</p>
    </div>

    <!-- Grid de 3 Blocos de Configuração -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- BLOCO 1: COLUNAS DO KANBAN -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
            <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                <i data-lucide="columns" class="w-5 h-5 text-blue-600"></i>
                <h2 class="font-bold text-slate-800">Colunas do Kanban (O.S.)</h2>
            </div>

            <form id="form-add-coluna" class="space-y-3 mb-4">
                <div class="flex gap-2">
                    <input type="text" id="col-titulo" required placeholder="Ex: Aguardando Peça"
                        class="flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-600 outline-none">
                    <input type="number" id="col-ordem" required value="1" min="1" title="Ordem"
                        class="w-16 px-2 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm text-center focus:border-blue-600 outline-none">
                    <input type="color" id="col-cor" value="#1D4ED8" title="Cor de destaque"
                        class="w-10 h-9 p-0.5 bg-white border border-slate-300 rounded-lg cursor-pointer">
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Coluna
                </button>
            </form>

            <div id="lista-colunas" class="space-y-2 flex-1 overflow-y-auto max-h-72">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- BLOCO 2: TIPOS DE MANUTENÇÃO -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
            <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                <i data-lucide="tag" class="w-5 h-5 text-[#00B88D]"></i>
                <h2 class="font-bold text-slate-800">Tipos de Manutenção</h2>
            </div>

            <form id="form-add-tipo" class="space-y-3 mb-4">
                <div class="flex gap-2">
                    <input type="text" id="tipo-nome" required placeholder="Ex: Corretiva, Preventiva..."
                        class="flex-1 px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-600 outline-none">
                    <input type="color" id="tipo-cor" value="#00E5B0" title="Cor da Etiqueta"
                        class="w-10 h-9 p-0.5 bg-white border border-slate-300 rounded-lg cursor-pointer">
                </div>
                <button type="submit" class="w-full bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4"></i> Adicionar Tipo
                </button>
            </form>

            <div id="lista-tipos" class="space-y-2 flex-1 overflow-y-auto max-h-72">
                <!-- Preenchido via JS -->
            </div>
        </div>

        <!-- BLOCO 3: SETORES EXECUTANTES -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 flex flex-col">
            <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100">
                <i data-lucide="layers" class="w-5 h-5 text-slate-700"></i>
                <h2 class="font-bold text-slate-800">Setores Executantes</h2>
            </div>

            <form id="form-add-setor" class="space-y-3 mb-4">
                <input type="text" id="setor-nome" required placeholder="Ex: Mecânica, Elétrica, Predial..."
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:border-blue-600 outline-none">
                <button type="submit" class="w-full bg-[#0B1120] hover:bg-slate-800 text-white font-semibold py-2 rounded-lg text-xs transition flex items-center justify-center gap-1.5">
                    <i data-lucide="plus" class="w-4 h-4 text-[#00E5B0]"></i> Adicionar Setor
                </button>
            </form>

            <div id="lista-setores" class="space-y-2 flex-1 overflow-y-auto max-h-72">
                <!-- Preenchido via JS -->
            </div>
        </div>

    </div>
</div>
