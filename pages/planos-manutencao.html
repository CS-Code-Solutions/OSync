<div class="space-y-6">
    <!-- Cabeçalho -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Planos de Manutenção & Manuais</h1>
            <p class="text-sm text-slate-500">Crie checklists preventivos e procedimentos padrão para vincular às Ordens de Serviço.</p>
        </div>
        <button onclick="abrirModalNovoPlano()" class="bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2 text-sm">
            <i data-lucide="file-plus-2" class="w-4 h-4"></i>
            <span>+ Novo Plano / Manual</span>
        </button>
    </div>

    <!-- Busca e Filtro -->
    <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-xs flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
            <input type="text" id="busca-planos" oninput="filtrarPlanosManutencao()" placeholder="Buscar por título, máquina ou item de inspeção..."
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-600">
        </div>
        <select id="filtro-escopo-plano" onchange="filtrarPlanosManutencao()" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm outline-none focus:border-blue-600">
            <option value="">Todos os Escopos</option>
            <option value="padrao">Procedimento Padrão (Todas Máquinas)</option>
            <option value="maquina">Dedicado a Máquina Específica</option>
        </select>
    </div>

    <!-- Lista de Planos -->
    <div id="lista-planos-manutencao" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
</div>

<!-- MODAL: CRIAR / EDITAR PLANO DE MANUTENÇÃO -->
<div id="modal-plano-manutencao" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-xs z-50 flex items-center justify-center p-3 sm:p-4">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden max-h-[92vh] flex flex-col">
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0] shrink-0">
            <h3 id="modal-plano-titulo" class="text-base font-bold text-white flex items-center gap-2">
                <i data-lucide="clipboard-check" class="w-5 h-5 text-[#00E5B0]"></i>
                <span>Novo Plano de Manutenção</span>
            </h3>
            <button type="button" onclick="fecharModalPlano()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <form id="form-plano-manutencao" class="p-6 space-y-4 overflow-y-auto flex-1">
            <input type="hidden" id="plano-edit-id" value="">

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Título do Plano / Manual *</label>
                    <input type="text" id="plano-titulo" required placeholder="Ex: Preventiva Mensal / Inspeção Elétrica"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Periodicidade</label>
                    <select id="plano-periodicidade" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600">
                        <option value="Sob Demanda">Sob Demanda</option>
                        <option value="Diária">Diária</option>
                        <option value="Semanal">Semanal</option>
                        <option value="Quinzenal">Quinzenal</option>
                        <option value="Mensal">Mensal</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                        <option value="Anual">Anual</option>
                    </select>
                </div>
            </div>

            <!-- Escopo: Procedimento Padrão x Máquina Específica -->
            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                <label class="block text-xs font-bold text-slate-700">Aplicação do Plano *</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                    <label class="cursor-pointer border border-slate-300 bg-white rounded-xl p-3 flex items-center gap-2.5 text-xs font-bold text-slate-700 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                        <input type="radio" name="plano-escopo" value="padrao" checked onchange="alternarEscopoPlano()" class="accent-blue-600">
                        <div>
                            <span class="block text-slate-900">Procedimento Padrão</span>
                            <span class="text-[11px] font-normal text-slate-500">Disponível para qualquer máquina</span>
                        </div>
                    </label>
                    <label class="cursor-pointer border border-slate-300 bg-white rounded-xl p-3 flex items-center gap-2.5 text-xs font-bold text-slate-700 has-[:checked]:border-blue-600 has-[:checked]:bg-blue-50">
                        <input type="radio" name="plano-escopo" value="maquina" onchange="alternarEscopoPlano()" class="accent-blue-600">
                        <div>
                            <span class="block text-slate-900">Máquina Específica</span>
                            <span class="text-[11px] font-normal text-slate-500">Dedicado a um equipamento</span>
                        </div>
                    </label>
                </div>

                <div id="box-plano-maquina-especifica" class="hidden pt-1">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Selecione o Equipamento *</label>
                    <select id="plano-ativo-id" class="w-full px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-sm outline-none focus:border-blue-600"></select>
                </div>
            </div>

            <!-- Instruções / Manual Técnico -->
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Orientações Gerais / Manual de Execução (Opcional)</label>
                <textarea id="plano-instrucoes" rows="2" placeholder="EPIs obrigatórios, bloqueio LOTO, ferramentas necessárias ou recomendações técnicas..."
                    class="w-full px-3.5 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs outline-none focus:border-blue-600"></textarea>
            </div>

            <!-- Construtor de Itens do Checklist -->
            <div class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2.5">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="list-checks" class="w-4 h-4 text-blue-600"></i>
                        <span>Itens de Inspeção (Checklist OK / Não OK) *</span>
                    </label>
                    <span id="plano-qtd-itens" class="text-[11px] font-bold text-slate-500">0 itens</span>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="novo-item-checklist-input" onkeydown="if(event.key==='Enter'){event.preventDefault();adicionarItemChecklistPlano();}"
                        placeholder="Ex: Verificar nível de óleo hidráulico e vazamentos..."
                        class="flex-1 px-3 py-2 bg-white border border-slate-300 rounded-lg text-xs outline-none focus:border-blue-600">
                    <button type="button" onclick="adicionarItemChecklistPlano()"
                        class="px-3.5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-lg text-xs font-bold shrink-0 flex items-center gap-1">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>Adicionar</span>
                    </button>
                </div>

                <div id="lista-itens-construtor-plano" class="space-y-1.5 max-h-52 overflow-y-auto pr-1"></div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="fecharModalPlano()" class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button type="submit" id="btn-salvar-plano" class="px-5 py-2.5 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm">Salvar Plano</button>
            </div>
        </form>
    </div>
</div>
