<div class="space-y-6">
    <!-- Cabeçalho -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Planos de Manutenção</h1>
            <p class="text-sm text-slate-500">Cadastre checklists de verificação preventiva e preditiva por equipamento ou gerais.</p>
        </div>
        <button onclick="abrirModalNovoPlano()"
            class="bg-[#0B1120] hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-sm font-semibold flex items-center justify-center gap-2 shadow-md transition">
            <i data-lucide="plus-circle" class="w-4 h-4 text-[#00E5B0]"></i>
            <span>Novo Plano de Manutenção</span>
        </button>
    </div>

    <!-- Barra de Busca e Filtro -->
    <div class="osync-card p-4 grid grid-cols-1 sm:grid-cols-3 gap-3">
        <div class="relative sm:col-span-2">
            <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3"></i>
            <input type="text" id="busca-plano" onkeyup="filtrarPlanosManutencao()"
                placeholder="Buscar plano por título, máquina ou periodicidade..."
                class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-500">
        </div>
        <select id="filtro-plano-ativo" onchange="filtrarPlanosManutencao()"
            class="px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-700 bg-white outline-none focus:border-blue-500">
            <option value="">Todas as Máquinas / Gerais</option>
        </select>
    </div>

    <!-- Grid de Planos -->
    <div id="grid-planos-manutencao" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400">
            Carregando planos de manutenção...
        </div>
    </div>
</div>

<!-- MODAL: CADASTRAR / EDITAR PLANO DE MANUTENÇÃO -->
<div id="modal-plano-manutencao" class="hidden fixed inset-0 bg-slate-900/75 backdrop-blur-xs z-50 flex items-center justify-center p-4 overflow-y-auto">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl border border-slate-200 overflow-hidden my-8">
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0]">
            <h3 id="modal-plano-titulo" class="text-white font-bold flex items-center gap-2">
                <i data-lucide="clipboard-check" class="w-5 h-5 text-[#00E5B0]"></i>
                <span>Novo Plano de Manutenção</span>
            </h3>
            <button onclick="fecharModalPlano()" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form id="form-plano-manutencao" class="p-6 space-y-4 max-h-[82vh] overflow-y-auto">
            <input type="hidden" id="plano-edit-id" value="">

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-2">
                    <label class="block text-xs font-bold text-slate-600 mb-1">Título do Plano *</label>
                    <input type="text" id="plano-titulo" required placeholder="Ex: Preventiva Mensal - Prensa 01"
                        class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">Periodicidade</label>
                    <select id="plano-periodicidade"
                        class="w-full px-3 py-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:border-blue-500">
                        <option value="Semanal">Semanal</option>
                        <option value="Quinzenal">Quinzenal</option>
                        <option value="Mensal" selected>Mensal</option>
                        <option value="Bimestral">Bimestral</option>
                        <option value="Trimestral">Trimestral</option>
                        <option value="Semestral">Semestral</option>
                        <option value="Anual">Anual</option>
                        <option value="Sob Demanda">Sob Demanda</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Máquina / Ativo Vinculado (Opcional)</label>
                <select id="plano-ativo-id"
                    class="w-full px-3.5 py-2.5 border border-slate-300 rounded-lg text-sm bg-white outline-none focus:border-blue-500">
                    <option value="">Geral (Disponível para qualquer máquina)</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Instruções Gerais / Segurança (Opcional)</label>
                <textarea id="plano-instrucoes" rows="2" placeholder="Ex: Desenergizar painel principal e aplicar bloqueio LOTO antes de iniciar..."
                    class="w-full px-3.5 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-500"></textarea>
            </div>

            <!-- LISTA DE ITENS DO CHECKLIST -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3">
                <div class="flex items-center justify-between gap-2">
                    <div>
                        <h4 class="text-xs font-bold uppercase tracking-wider text-slate-700">Itens de Verificação (Checklist) *</h4>
                        <p class="text-[11px] text-slate-500">Cada item será avaliado como OK ou Não OK durante a execução da O.S.</p>
                    </div>
                    <button type="button" onclick="adicionarCampoItemPlano()"
                        class="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-lg flex items-center gap-1.5 transition shrink-0">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>Adicionar Item</span>
                    </button>
                </div>

                <div id="container-itens-plano" class="space-y-2"></div>
            </div>

            <div class="pt-3 flex justify-end gap-2 border-t border-slate-100">
                <button type="button" onclick="fecharModalPlano()"
                    class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">
                    Cancelar
                </button>
                <button type="submit" id="btn-salvar-plano"
                    class="px-5 py-2 text-sm bg-[#0B1120] hover:bg-slate-800 text-white font-semibold rounded-lg">
                    Salvar Plano
                </button>
            </div>
        </form>
    </div>
</div>
