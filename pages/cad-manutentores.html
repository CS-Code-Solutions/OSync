<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Equipe de Manutentores</h1>
            <p class="text-sm text-slate-500">Técnicos responsáveis pela execução e abertura de Ordens de Serviço.</p>
        </div>
        <button onclick="abrirModalNovoUsuario('Manutentor')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
            <i data-lucide="user-plus" class="w-5 h-5"></i>
            <span>+ Manutentor</span>
        </button>
    </div>

    <!-- Lista de Manutentores -->
    <div id="lista-usuarios-perfil" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Preenchido via js/cadastros.js -->
    </div>
</div>

<!-- MODAL DE CADASTRO DE USUÁRIO (Compartilhado) -->
<div id="modal-novo-usuario" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0]">
            <h3 id="modal-usuario-titulo" class="text-base font-bold text-white">Cadastrar Manutentor</h3>
            <button onclick="fecharModalNovoUsuario()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <form id="form-novo-usuario" class="p-6 space-y-4">
            <input type="hidden" id="user-perfil-alvo" value="Manutentor">
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Completo *</label>
                <input type="text" id="user-nome" required placeholder="Ex: Carlos Mendes"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail de Acesso *</label>
                <input type="email" id="user-email" required placeholder="carlos@empresa.com"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Senha Inicial *</label>
                <input type="password" id="user-senha" required minlength="6" placeholder="Mínimo 6 caracteres"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Especialidade / Setor *</label>
                <input type="text" id="user-setor" required placeholder="Ex: Mecânica / Elétrica"
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm outline-none focus:border-blue-600">
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="fecharModalNovoUsuario()" class="px-4 py-2 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-lg">Cancelar</button>
                <button type="submit" id="btn-salvar-usuario" class="px-5 py-2 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow-sm">Criar Acesso</button>
            </div>
        </form>
    </div>
</div>
