<div class="space-y-6">
    <!-- Cabeçalho e Botão Principal -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Equipe de Manutentores</h1>
            <p class="text-sm text-slate-500">Técnicos responsáveis pela execução, abertura de O.S. e permissões de acesso.</p>
        </div>
        <button onclick="abrirModalNovoUsuario('Manutentor')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
            <i data-lucide="user-plus" class="w-5 h-5"></i>
            <span>+ Manutentor</span>
        </button>
    </div>

    <!-- Lista de Cards dos Manutentores Cadastrados -->
    <div id="lista-usuarios-perfil" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Preenchido automaticamente pelo js/cadastros.js -->
    </div>
</div>

<!-- MODAL: CADASTRAR OU EDITAR MANUTENTOR -->
<div id="modal-novo-usuario" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden max-h-[92vh] flex flex-col">
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0] shrink-0">
            <h3 id="modal-usuario-titulo" class="text-base font-bold text-white">Cadastrar Manutentor</h3>
            <button onclick="fecharModalNovoUsuario()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <form id="form-novo-usuario" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="user-perfil-alvo" value="Manutentor">
            <input type="hidden" id="user-edit-id" value="">

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Completo *</label>
                <input type="text" id="user-nome" required placeholder="Ex: Cristian"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div id="grupo-user-email">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail de Acesso *</label>
                    <input type="email" id="user-email" required placeholder="cristian@empresa.com"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
                </div>

                <div id="grupo-user-senha">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Senha Inicial *</label>
                    <input type="password" id="user-senha" required minlength="6" placeholder="Mínimo 6 caracteres"
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
                </div>
            </div>

            <!-- Campo Selecionável de Especialidade / Setor -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Especialidade / Setor *</label>
                    <select id="user-setor-select" onchange="verificarOutraEspecialidade()" required
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
                        <option value="Mecânica">Mecânica</option>
                        <option value="Elétrica">Elétrica</option>
                        <option value="Predial">Predial</option>
                        <option value="Outra">Outra...</option>
                    </select>
                </div>

                <!-- Campo Extra (Aparece apenas se escolher "Outra") -->
                <div id="grupo-user-setor-outro" class="hidden">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Qual especialidade / setor? *</label>
                    <input type="text" id="user-setor-outro" placeholder="Digite a especialidade..."
                        class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
                </div>
            </div>

            <!-- Seletor de Páginas com Acesso Liberado -->
            <div id="grupo-user-permissoes" class="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-2.5">
                <div class="flex items-center justify-between gap-2">
                    <label class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                        <i data-lucide="shield-check" class="w-4 h-4 text-blue-600"></i>
                        <span>Páginas com Acesso Liberado *</span>
                    </label>
                    <button type="button" onclick="alternarTodasPermissoesManutentor()"
                        class="text-[11px] font-bold text-blue-600 hover:text-blue-800 underline">
                        Marcar / Desmarcar Todas
                    </button>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="os" checked class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Ordens de Serviço (O.S.)</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="solicitacoes" checked class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Solicitações / Chamados</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="dashboard" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Dashboard Gerencial</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="cad-ativos" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Ativos (Máquinas)</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="relatorios-os" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Relatórios de O.S.</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="relatorios-maquinas" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Relatório de Máquinas</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="relatorios-manutentores" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Relatório de Manutentores</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="centros-custo" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Centros de Custo</span>
                    </label>

                    <label class="flex items-center gap-2 p-2 bg-white rounded-lg border border-slate-200 cursor-pointer hover:border-blue-400">
                        <input type="checkbox" name="user-perm-pagina" value="configuracoes" class="w-4 h-4 accent-blue-600 rounded">
                        <span class="font-semibold text-slate-800">Configurações</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="fecharModalNovoUsuario()" class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button type="submit" id="btn-salvar-usuario" class="px-5 py-2.5 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm">Criar Acesso</button>
            </div>
        </form>
    </div>
</div>
