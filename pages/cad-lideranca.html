<div class="space-y-6">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Liderança de Setor</h1>
            <p class="text-sm text-slate-500">Usuários autorizados a abrir solicitações de manutenção nos setores.</p>
        </div>
        <button onclick="abrirModalNovoUsuario('Lideranca')" class="bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold px-5 py-3 rounded-xl shadow-sm transition flex items-center justify-center gap-2">
            <i data-lucide="user-check" class="w-5 h-5"></i>
            <span>+ Líder de Setor</span>
        </button>
    </div>

    <!-- Lista de Líderes -->
    <div id="lista-usuarios-perfil" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Preenchido via js/cadastros.js -->
    </div>
</div>

<!-- MODAL DE CADASTRO OU EDIÇÃO DE LIDERANÇA -->
<div id="modal-novo-usuario" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl border border-slate-200 overflow-hidden max-h-[92vh] flex flex-col">
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0] shrink-0">
            <h3 id="modal-usuario-titulo" class="text-base font-bold text-white">Cadastrar Líder de Setor</h3>
            <button onclick="fecharModalNovoUsuario()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>

        <form id="form-novo-usuario" class="p-6 space-y-4 overflow-y-auto">
            <input type="hidden" id="user-perfil-alvo" value="Lideranca">
            <input type="hidden" id="user-edit-id" value="">

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Completo *</label>
                <input type="text" id="user-nome" required placeholder="Ex: Mariana Souza"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
            </div>

            <div id="grupo-user-email">
                <label class="block text-xs font-semibold text-slate-600 mb-1">E-mail de Acesso *</label>
                <input type="email" id="user-email" required placeholder="mariana@empresa.com"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
            </div>

            <div id="grupo-user-senha">
                <label class="block text-xs font-semibold text-slate-600 mb-1">Senha Inicial *</label>
                <input type="password" id="user-senha" required minlength="6" placeholder="Mínimo 6 caracteres"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Setor Sob Responsabilidade *</label>
                <input type="text" id="user-setor" required placeholder="Ex: Linha de Montagem 01"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm outline-none focus:bg-white focus:border-blue-600">
            </div>

            <!-- Permissões de Telas Visíveis para o Líder -->
            <div class="pt-1">
                <div class="flex items-center justify-between mb-1.5">
                    <label class="block text-xs font-semibold text-slate-600">Telas Liberadas no Menu *</label>
                    <button type="button" onclick="alternarTodasPermissoesManutentor()" class="text-[11px] font-bold text-blue-600 hover:underline">
                        Marcar / Desmarcar todas
                    </button>
                </div>
                <div class="grid grid-cols-2 gap-2 bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs">
                    <label data-perm-solicitacoes="true" class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="solicitacoes" checked class="rounded accent-blue-600">
                        <span>Solicitações</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="planos-manutencao" class="rounded accent-blue-600">
                        <span>Planos Manut.</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="dashboard" class="rounded accent-blue-600">
                        <span>Dashboard</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="cad-ativos" class="rounded accent-blue-600">
                        <span>Máquinas (Ativos)</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="relatorios-maquinas" class="rounded accent-blue-600">
                        <span>Rel. Máquinas</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="relatorios-os" class="rounded accent-blue-600">
                        <span>Rel. O.S.</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer text-slate-700 font-medium">
                        <input type="checkbox" name="user-perm-pagina" value="centros-custo" class="rounded accent-blue-600">
                        <span>Centros de Custo</span>
                    </label>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                <button type="button" onclick="fecharModalNovoUsuario()" class="px-4 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">Cancelar</button>
                <button type="submit" id="btn-salvar-usuario" class="px-5 py-2.5 text-sm font-bold bg-blue-600 hover:bg-blue-700 text-white rounded-xl shadow-sm">Criar Acesso</button>
            </div>
        </form>
    </div>
</div>
