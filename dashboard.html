<div class="space-y-6">
    <!-- Cabeçalho do Dashboard -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">Dashboard Gerencial</h1>
            <p class="text-xs sm:text-sm text-slate-500">Visão em tempo real dos indicadores, custos e desempenho da manutenção.</p>
        </div>

        <div class="flex items-center gap-2.5 flex-wrap">
            <!-- Filtro Rápido de Período -->
            <select id="dash-filtro-periodo" onchange="renderizarWidgetsDashboard()"
                class="px-3.5 py-2.5 bg-white border border-slate-300 rounded-xl text-xs font-bold text-slate-700 outline-none focus:border-blue-600 shadow-2xs">
                <option value="total">Todo o Histórico</option>
                <option value="mes_atual" selected>Mês Atual</option>
                <option value="ultimos_30d">Últimos 30 Dias</option>
                <option value="ano_atual">Ano Atual</option>
            </select>

            <!-- Botão Ajustar Página -->
            <button onclick="abrirDrawerAjustarDashboard()"
                class="bg-[#0B1120] hover:bg-slate-800 text-[#00E5B0] border border-[#00E5B0]/40 font-bold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center gap-2 text-xs">
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
                <span>Ajustar Página</span>
            </button>
        </div>
    </div>

    <!-- ÁREA DINÂMICA DOS BLOCOS ATIVOS DO DASHBOARD -->
    <div id="dashboard-widgets-container" class="space-y-6">
        <div class="text-center py-12 text-slate-400 text-sm">Carregando indicadores e gráficos...</div>
    </div>
</div>

<!-- GAVETA LATERAL FLUIDA: AJUSTAR PÁGINA DO DASHBOARD -->
<div id="drawer-ajustar-dashboard" class="hidden fixed inset-0 bg-slate-900/70 backdrop-blur-xs z-50 flex justify-end">
    <div class="bg-white w-full max-w-md h-full shadow-2xl border-l border-slate-200 flex flex-col overflow-hidden animate-fade-in">
        <!-- Topo da Gaveta -->
        <div class="bg-[#0B1120] px-6 py-4 flex items-center justify-between border-b-2 border-[#00E5B0] shrink-0">
            <div class="flex items-center gap-2.5">
                <i data-lucide="sliders-horizontal" class="w-5 h-5 text-[#00E5B0]"></i>
                <div>
                    <h3 class="text-sm font-bold text-white">Ajustar Página do Dashboard</h3>
                    <p class="text-[11px] text-slate-400">Ative, oculte ou reordene os blocos de relatórios</p>
                </div>
            </div>
            <button onclick="fecharDrawerAjustarDashboard()" class="text-slate-400 hover:text-white p-1">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <!-- Lista Fluida de Blocos -->
        <div class="p-5 flex-1 overflow-y-auto space-y-2.5" id="lista-config-widgets-dashboard">
            <!-- Preenchido via js/dashboard.js -->
        </div>

        <!-- Rodapé com Ações -->
        <div class="p-4 bg-slate-50 border-t border-slate-200 flex items-center justify-between gap-2 shrink-0">
            <button type="button" onclick="restaurarPadraoDashboard()"
                class="px-3.5 py-2.5 text-xs font-bold text-slate-600 hover:bg-slate-200 rounded-xl transition">
                Restaurar Padrão
            </button>
            <button type="button" id="btn-salvar-layout-dashboard" onclick="salvarConfiguracaoDashboard()"
                class="px-5 py-2.5 text-xs font-bold bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] rounded-xl shadow-sm transition flex items-center gap-1.5">
                <i data-lucide="check" class="w-4 h-4"></i>
                <span>Aplicar e Salvar</span>
            </button>
        </div>
    </div>
</div>
