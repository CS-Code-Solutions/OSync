<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSync | Login</title>
    <meta name="description" content="Acesse o sistema OSync para gerenciar ordens de serviço, solicitações de manutenção e equipamentos.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OSync">
    <meta property="og:title" content="OSync | Acesso ao Sistema de Manutenção">
    <meta property="og:description" content="Faça login para gerenciar ordens de serviço, solicitações de setor e histórico de máquinas.">
    <meta property="og:url" content="https://osync.vercel.app/pages/login">
    <meta property="og:image" content="https://osync.vercel.app/images/osync1200x630.png">
    <meta property="og:image:secure_url" content="https://osync.vercel.app/images/osync1200x630.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OSync | Acesso ao Sistema de Manutenção">
    <meta name="twitter:description" content="Faça login para gerenciar ordens de serviço, solicitações de setor e histórico de máquinas.">
    <meta name="twitter:image" content="https://osync.vercel.app/images/osync1200x630.png">
    <link rel="icon" type="image/png" href="/images/ico.png">
    <link rel="apple-touch-icon" href="/images/ico.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="/css/style.css?v=2">
    <style>
        .bg--responsivo {
            background-color: #0B1120;
            background-image: linear-gradient(to bottom, rgba(11, 17, 32, 0.72), rgba(11, 17, 32, 0.85)), url('/images/mob.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }
        @media (min-width: 768px) {
            .bg--responsivo {
                background-image: linear-gradient(to bottom, rgba(11, 17, 32, 0.68), rgba(11, 17, 32, 0.82)), url('/images/pc.png');
            }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg--responsivo text-white">

    <div class="flex-1 flex items-center justify-center p-4">
        <div class="bg-[#131C31]/90 backdrop-blur-md w-full max-w-md rounded-2xl shadow-2xl border border-slate-700/80 p-8">
            <!-- Logo OSync -->
            <div class="flex flex-col items-center mb-8">
                <img src="/images/log.png" alt="OSync" draggable="false" class="max-h-40 w-auto object-contain mb-2">
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">E-mail de Acesso</label>
                    <div class="relative">
                        <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <input type="email" id="email" required placeholder="usuario@empresa.com"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Senha</label>
                    <div class="relative">
                        <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-3.5"></i>
                        <input type="password" id="password" required placeholder="••••••••"
                            class="w-full pl-10 pr-4 py-3 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white placeholder-slate-500 focus:border-[#00E5B0] outline-none transition">
                    </div>
                </div>

                <div id="-error" class="hidden text-xs text-rose-400 bg-rose-950/80 border border-rose-800 p-3 rounded-lg"></div>
                <div id="-success" class="hidden text-xs text-[#00E5B0] bg-emerald-950/80 border border-[#00E5B0]/40 p-3 rounded-lg"></div>

                <button type="submit" id="btn-"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-600/25 transition flex items-center justify-center gap-2 mt-2">
                    <span>Acessar Sistema</span>
                    <i data-lucide="log-in" class="w-4 h-4"></i>
                </button>

                <div class="text-center pt-2">
                    <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-300 hover:text-[#00E5B0] transition">
                        Não tem acesso? Solicitar cadastro ao Gestor
                    </button>
                </div>
            </form>

            <!-- FORMULÁRIO DE SOLICITAÇÃO DE ACESSO (AGUARDA LIBERAÇÃO DO GESTOR) -->
            <form id="register-form" class="hidden space-y-3.5">
                <div class="bg-[#0B1120]/90 border border-slate-700/80 p-3 rounded-xl text-xs text-slate-300">
                    Preencha seus dados abaixo. Seu acesso ficará <strong>pendente</strong> até a aprovação do gestor da empresa.
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Código da Empresa *</label>
                    <input type="text" id="reg-empresa-id" required maxlength="60" placeholder="Cole o código fornecido pelo gestor"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Seu Nome Completo *</label>
                    <input type="text" id="reg-nome" required maxlength="100" placeholder="Ex: João Silva"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Função *</label>
                        <select id="reg-perfil" class="w-full px-3 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                            <option value="Manutentor">Manutentor</option>
                            <option value="Lideranca">Liderança</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">Setor / Área *</label>
                        <input type="text" id="reg-setor" required maxlength="80" placeholder="Ex: Mecânica"
                            class="w-full px-3.5 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Seu E-mail *</label>
                    <input type="email" id="reg-email" required maxlength="120" placeholder="seu.email@empresa.com"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Crie uma Senha (mín. 6 dígitos) *</label>
                    <input type="password" id="reg-senha" required minlength="6" maxlength="128" placeholder="••••••••"
                        class="w-full px-3.5 py-2.5 bg-[#0B1120]/90 border border-slate-700 rounded-xl text-sm text-white focus:border-[#00E5B0] outline-none">
                </div>

                <!-- ACEITE OBRIGATÓRIO LGPD (NUNCA PRÉ-MARCADO) -->
                <label class="flex items-start gap-2.5 p-3 rounded-xl bg-[#0B1120]/80 border border-slate-700 cursor-pointer hover:border-[#00E5B0]/60 transition select-none">
                    <input type="checkbox" id="reg-lgpd-aceite" required
                        class="mt-0.5 w-4 h-4 accent-[#00E5B0] rounded cursor-pointer shrink-0">
                    <span class="text-[11px] text-slate-300 leading-relaxed">
                        Li e concordo com a <a href="/pages/privacidade.html" target="_blank" rel="noopener noreferrer" class="text-[#00E5B0] font-bold underline hover:opacity-80">Política de Privacidade e Termos de Uso</a> e autorizo a coleta dos meus dados para gestão de manutenção (LGPD).
                    </span>
                </label>

                <div id="reg-error" class="hidden text-xs text-rose-400 bg-rose-950/80 border border-rose-800 p-3 rounded-lg"></div>

                <button type="submit" id="btn-register"
                    class="w-full bg-[#00E5B0] hover:bg-[#00c99b] text-[#0B1120] font-bold py-3 rounded-xl transition">
                    Enviar Solicitação de Acesso
                </button>
                <div class="text-center pt-1">
                    <button type="button" onclick="alternarModoCadastro()" class="text-xs text-slate-300 hover:text-white">
                        Voltar para o login
                    </button>
                </div>
            </form>
        </div>
    </div>

    <footer class="py-4 px-4 text-center text-xs text-slate-300 bg-[#0B1120]/75 backdrop-blur-xs border-t border-slate-800/80 space-y-1">
        <div>
            <a href="/pages/privacidade.html" class="text-slate-300 hover:text-[#00E5B0] underline transition">Política de Privacidade e LGPD</a>
        </div>
        <div>
            © 2026 OSync | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" rel="noopener noreferrer" class="font-semibold text-[#00E5B0] hover:underline">CS Code Solutions</a>
        </div>
    </footer>

    <script src="/js/firebase-config.js"></script>
    <script>
        lucide.createIcons();

        // Blindagem contra menu nativo de toque longo, cópia e arraste de imagens/textos
        (function ativarBlindagem() {
            const ehCampoEditavel = (el) => {
                if (!el) return false;
                const tag = el.tagName;
                return tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable;
            };

            document.addEventListener('contextmenu', (e) => {
                if (!ehCampoEditavel(e.target)) e.preventDefault();
            });

            document.addEventListener('dragstart', (e) => {
                if (e.target && e.target.tagName === 'IMG') e.preventDefault();
            });

            document.addEventListener('copy', (e) => {
                if (!ehCampoEditavel(document.activeElement)) e.preventDefault();
            });

            document.addEventListener('cut', (e) => {
                if (!ehCampoEditavel(document.activeElement)) e.preventDefault();
            });
        })();

        function alternarModoCadastro() {
            document.getElementById('-form').classList.toggle('hidden');
            document.getElementById('register-form').classList.toggle('hidden');
            document.getElementById('-error').classList.add('hidden');
            document.getElementById('-success').classList.add('hidden');
            document.getElementById('reg-error').classList.add('hidden');
        }

        document.getElementById('-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-');
            const errorBox = document.getElementById('-error');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Verificando...</span>';
            errorBox.classList.add('hidden');

            try {
                const cred = await auth.signInWithEmailAndPassword(email, password);
                const doc = await db.collection('usuarios').doc(cred.user.uid).get();

                if (!doc.exists) {
                    await auth.signOut();
                    throw new Error('Cadastro não encontrado ou excluído pelo gestor.');
                }

                const dados = doc.data();
                if (dados.statusAcesso === 'pendente') {
                    await auth.signOut();
                    throw new Error('Sua solicitação ainda está aguardando aprovação do gestor.');
                }

                if (dados.ativo === false) {
                    await auth.signOut();
                    throw new Error('Seu acesso foi desativado pelo administrador.');
                }

                window.location.href = '/';
            } catch (err) {
                errorBox.textContent = err.message.includes('auth/') ? 'E-mail ou senha inválidos.' : err.message;
                errorBox.classList.remove('hidden');
                btn.disabled = false;
                btn.innerHTML = '<span>Acessar Sistema</span><i data-lucide="log-in" class="w-4 h-4"></i>';
                lucide.createIcons();
            }
        });

        // Enviar Solicitação de Cadastro + Registro de Aceite LGPD + Push para Gestão
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-register');
            const errorBox = document.getElementById('reg-error');
            btn.disabled = true;
            btn.textContent = 'Enviando solicitação...';
            errorBox.classList.add('hidden');

            try {
                const aceiteLgpd = document.getElementById('reg-lgpd-aceite')?.checked;
                if (!aceiteLgpd) {
                    throw new Error('É obrigatório aceitar a Política de Privacidade (LGPD) para solicitar acesso.');
                }

                const empresaId = document.getElementById('reg-empresa-id').value.trim();
                if (!/^[a-zA-Z0-9_-]{6,60}$/.test(empresaId)) {
                    throw new Error('Formato de Código da Empresa inválido.');
                }

                const nome = document.getElementById('reg-nome').value.trim();
                const perfilSelecionado = document.getElementById('reg-perfil').value;
                const perfil = (perfilSelecionado === 'Manutentor' || perfilSelecionado === 'Lideranca') ? perfilSelecionado : 'Manutentor';
                const setor = document.getElementById('reg-setor').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const senha = document.getElementById('reg-senha').value;

                // 1. Verifica se o Código da Empresa existe
                let empresaDoc;
                try {
                    empresaDoc = await db.collection('empresas').doc(empresaId).get();
                } catch (errConsulta) {
                    throw new Error('Permissão bloqueada ao validar empresa.');
                }

                if (!empresaDoc.exists) {
                    throw new Error('Código da Empresa não encontrado no banco. Confira o ID com o gestor.');
                }

                // 2. Cria credencial no Auth
                const cred = await auth.createUserWithEmailAndPassword(email, senha);
                const uid = cred.user.uid;

                // 3. Registra no Firestore como PENDENTE e INATIVO
                await db.collection('usuarios').doc(uid).set({
                    empresaId: empresaId,
                    nome: nome,
                    email: email,
                    perfil: perfil,
                    setor: setor,
                    ativo: false,
                    statusAcesso: 'pendente',
                    criadoEm: firebase.firestore.FieldValue.serverTimestamp()
                });

                // 4. Registra o aceite formal da Política de Privacidade (LGPD)
                await db.collection('termos_aceites').doc(uid).set({
                    aceito: true,
                    versao: '1.0',
                    nome: nome,
                    email: email,
                    empresaId: empresaId,
                    dataAceite: firebase.firestore.FieldValue.serverTimestamp(),
                    userAgent: navigator.userAgent || ''
                });

                // 5. Notifica a Gestão via Push antes de encerrar sessão
                await fetch('/api/notificar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: 'novo_cadastro',
                        empresaId: empresaId,
                        remetenteUid: uid,
                        perfisAlvo: ['Admin'],
                        titulo: 'Nova Solicitação de Cadastro',
                        corpo: `${nome} (${perfil} - ${setor}) solicitou acesso ao sistema.`,
                        urlDestino: '/'
                    })
                }).catch(() => {});

                // 6. Desloga imediatamente para impedir entrada automática
                await auth.signOut();

                e.target.reset();
                alternarModoCadastro();

                const successBox = document.getElementById('-success');
                successBox.textContent = 'Solicitação enviada! Aguarde o gestor liberar seu acesso para entrar.';
                successBox.classList.remove('hidden');

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Enviar Solicitação de Acesso';
            }
        });
    </script>
</body>
</html>
