<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Manager Service</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
        <div class="flex justify-center mb-6">
            <!-- Coloque o ícone/logo na pasta -->
            <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center">
                <span class="text-3xl text-purple-600 font-bold">⚙️</span>
            </div>
        </div>
        <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">MANAGER SERVICE</h2>

        <form onsubmit="event.preventDefault(); window.location.href='index.html';">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Usuário</label>
                <input type="text" placeholder="Digite seu usuário" class="w-full px-4 py-3 rounded-lg bg-gray-100 border-transparent focus:border-purple-500 focus:bg-white focus:ring-2 outline-none">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-semibold text-gray-700 mb-2">Senha</label>
                <input type="password" placeholder="Digite sua senha" class="w-full px-4 py-3 rounded-lg bg-gray-100 border-transparent focus:border-purple-500 focus:bg-white focus:ring-2 outline-none">
            </div>
            <button type="submit" class="w-full bg-[#8B5CF6] hover:bg-[#7C3AED] text-white font-bold py-3 rounded-lg transition duration-200">
                Acessar
            </button>
        </form>
    </div>

    <!-- Scripts -->
    <script src="supabase-config.js"></script>
</body>
</html>
