<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Service - Login</title>
    <!-- Importação do Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importação da fonte (opcional, para visual mais moderno) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm">
        <!-- Substitua 'logo.png' pelo caminho da sua imagem da engrenagem roxa -->
        <div class="flex justify-center mb-6">
            <img src="logo.png" alt="Manager Service Logo" class="h-20"> 
        </div>

        <h2 class="text-2xl font-bold text-center text-gray-800 mb-8">MANAGER SERVICE</h2>

        <form action="index.html" method="GET">
            <div class="mb-4">
                <label for="usuario" class="block text-sm font-semibold text-gray-700 mb-2">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-100 border-transparent focus:border-purple-500 focus:bg-white focus:ring-0 outline-none text-gray-700">
            </div>

            <div class="mb-6 relative">
                <label for="senha" class="block text-sm font-semibold text-gray-700 mb-2">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha" 
                       class="w-full px-4 py-3 rounded-lg bg-gray-100 border-transparent focus:border-purple-500 focus:bg-white focus:ring-0 outline-none text-gray-700">
                <!-- Ícone de visualizar senha (visual apenas) -->
                <span class="absolute right-4 top-10 text-gray-400 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                    </svg>
                </span>
            </div>

            <button type="submit" 
                    class="w-full bg-[#8B5CF6] hover:bg-[#7C3AED] text-white font-bold py-3 rounded-lg transition duration-200">
                Acessar
            </button>
        </form>
    </div>

</body>
</html>
