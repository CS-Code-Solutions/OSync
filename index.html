<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSync | Gestão de Manutenção</title>
    <link rel="icon" type="image/png" href="images/ico.png">
    <link rel="apple-touch-icon" href="images/ico.png">
    <style>body.auth-loading { opacity: 0; }</style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- SDKs Firebase Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-loading min-h-screen flex flex-col justify-between pb-16 md:pb-0">

    <!-- CABEÇALHO SUPERIOR -->
    <header class="osync-navbar sticky top-0 z-40 px-4 h-16 flex items-center justify-between shadow-lg">
        <div class="flex items-center gap-6">
            <a href="#" onclick="navegarPara('os')" class="flex items-center gap-2 shrink-0">
                <img src="images/log.png" alt="OSync" class="h-9 w-auto object-contain">
            </a>

            <!-- Menu Superior Desktop (Sem duplicação) -->
            <nav class="hidden md:flex items-center gap-1.5" id="desktop-nav">
                <button id="nav-os" onclick="navegarPara('os')" data-page="os" class="nav-btn active flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm">
                    <i data-lucide="kanban" class="w-4 h-4"></i>
                    <span>O.S.</span>
                </button>

                <button id="nav-solicitacoes" onclick="navegarPara('solicitacoes')" data-page="solicitacoes" class="nav-btn flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm">
                    <i data-lucide="bell-ring" class="w-4 h-4"></i>
                    <span>Solicitações</span>
                </button>

                <!-- Dropdown Cadastros -->
                <div id="nav-cadastros-group" class="relative dropdown">
                    <button id="btn-menu-cadastros" class="nav-btn flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm">
                        <i data-lucide="folder-plus" class="w-4 h-4"></i>
                        <span>Cadastros</span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 opacity-70"></i>
                    </button>
                    <div class="dropdown-menu hidden absolute left-0 mt-1 w-52 bg-[#131C31] border border-slate-700 rounded-xl shadow-2xl py-1.5 z-50">
                        <button onclick="navegarPara('cad-manutentores')" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-blue-600 hover:text-white flex items-center gap-2.5 transition">
                            <i data-lucide="wrench" class="w-4 h-4 text-[#00E5B0]"></i>
                            <span>Manutentores</span>
                        </button>
                        <button onclick="navegarPara('cad-lideranca')" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-blue-600 hover:text-white flex items-center gap-2.5 transition">
                            <i data-lucide="user-check" class="w-4 h-4 text-[#00E5B0]"></i>
                            <span>Liderança</span>
                        </button>
                        <button onclick="navegarPara('cad-ativos')" class="w-full text-left px-4 py-2.5 text-sm text-slate-200 hover:bg-blue-600 hover:text-white flex items-center gap-2.5 transition">
                            <i data-lucide="cpu" class="w-4 h-4 text-[#00E5B0]"></i>
                            <span>Ativos (Máquinas)</span>
                        </button>
                    </div>
                </div>

                <button id="nav-configuracoes" onclick="navegarPara('configuracoes')" data-page="configuracoes" class="nav-btn flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                    <span>Configurações</span>
                </button>

                <button id="btn-menu-saas" onclick="navegarPara('saas-empresas')" data-page="saas-empresas" class="hidden nav-btn flex items-center gap-2 px-3.5 py-2 rounded-lg text-sm border border-[#00E5B0]/30 text-[#00E5B0]">
                    <i data-lucide="building-2" class="w-4 h-4"></i>
                    <span>Empresas (SaaS)</span>
                </button>
            </nav>
        </div>

        <!-- Direita: Status Nuvem + Usuário + Sair -->
        <div class="flex items-center gap-3 shrink-0">
            <div id="cloud-badge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-[#00E5B0] border border-[#00E5B0]/30">
                <span id="cloud-dot" class="w-2 h-2 rounded-full bg-[#00E5B0] animate-pulse"></span>
                <span id="cloud-label">Online</span>
            </div>

            <div class="hidden sm:flex flex-col text-right">
                <span id="header-user-name" class="text-xs font-semibold text-white">Carregando...</span>
                <span id="header-user-role" class="text-[10px] text-slate-400">Admin</span>
            </div>

            <button onclick="sairDoSistema()" title="Sair do Sistema" class="p-2 rounded-lg text-rose-500 hover:bg-rose-500/10 transition">
                <i data-lucide="power" class="w-5 h-5 stroke-[2.2]"></i>
            </button>
        </div>
    </header>

    <!-- ÁREA DINÂMICA DAS TELAS -->
    <main id="app-content" class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6"></main>

    <!-- RODAPÉ DESKTOP -->
    <footer class="hidden md:block bg-[#0B1120] text-slate-400 text-xs py-3.5 text-center border-t border-slate-800">
        © 2026 OSync | Powered by <a href="https://www.instagram.com/cs_code_solutions?exln=Ym1mNDMzYTYxa3d6" target="_blank" class="font-semibold text-[#00E5B0] hover:underline">CS Code Solutions</a>
    </footer>

    <!-- MENU INFERIOR MOBILE -->
    <nav class="osync-bottom-nav md:hidden fixed bottom-0 left-0 right-0 h-16 px-2 flex items-center justify-around z-40">
        <button id="mob-os" onclick="navegarPara('os')" data-page="os" class="mobile-nav-btn active flex flex-col items-center justify-center py-1.5 px-2">
            <i data-lucide="kanban" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px] font-medium">O.S.</span>
        </button>
        <button id="mob-solicitacoes" onclick="navegarPara('solicitacoes')" data-page="solicitacoes" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 px-2">
            <i data-lucide="bell-ring" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px] font-medium">Chamados</span>
        </button>
        <button id="mob-cadastros" onclick="abrirMenuCadastrosMobile()" data-page="cadastros" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 px-2">
            <i data-lucide="folder-plus" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px] font-medium">Cadastros</span>
        </button>
        <button id="mob-configuracoes" onclick="navegarPara('configuracoes')" data-page="configuracoes" class="mobile-nav-btn flex flex-col items-center justify-center py-1.5 px-2">
            <i data-lucide="settings" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px] font-medium">Config</span>
        </button>
        <!-- Botão exclusivo SuperAdmin no Mobile -->
        <button id="mob-saas" onclick="navegarPara('saas-empresas')" data-page="saas-empresas" class="hidden mobile-nav-btn flex flex-col items-center justify-center py-1.5 px-2 text-[#00E5B0]">
            <i data-lucide="building-2" class="w-5 h-5 mb-0.5"></i>
            <span class="text-[11px] font-bold">SaaS</span>
        </button>
    </nav>

    <!-- GAVETA MOBILE DE CADASTROS -->
    <div id="mobile-cadastros-drawer" class="hidden fixed inset-0 bg-black/60 z-50 md:hidden flex items-end">
        <div class="bg-[#131C31] w-full rounded-t-2xl border-t-2 border-[#00E5B0] p-5 space-y-2">
            <div class="flex justify-between items-center pb-2 border-b border-slate-700">
                <span class="text-sm font-bold text-white">Selecione o Cadastro</span>
                <button onclick="fecharMenuCadastrosMobile()" class="text-slate-400 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <button onclick="navegarPara('cad-manutentores'); fecharMenuCadastrosMobile();" class="w-full text-left p-3 rounded-xl bg-[#0B1120] text-white flex items-center gap-3">
                <i data-lucide="wrench" class="w-5 h-5 text-[#00E5B0]"></i>
                <span class="font-medium">Manutentores</span>
            </button>
            <button onclick="navegarPara('cad-lideranca'); fecharMenuCadastrosMobile();" class="w-full text-left p-3 rounded-xl bg-[#0B1120] text-white flex items-center gap-3">
                <i data-lucide="user-check" class="w-5 h-5 text-[#00E5B0]"></i>
                <span class="font-medium">Liderança</span>
            </button>
            <button onclick="navegarPara('cad-ativos'); fecharMenuCadastrosMobile();" class="w-full text-left p-3 rounded-xl bg-[#0B1120] text-white flex items-center gap-3">
                <i data-lucide="cpu" class="w-5 h-5 text-[#00E5B0]"></i>
                <span class="font-medium">Ativos (Máquinas)</span>
            </button>
        </div>
    </div>

    <script src="js/firebase-config.js?v=2"></script>
    <script src="js/ui-alerts.js?v=2"></script>
    <script src="js/image-utils.js?v=2"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/router.js?v=2"></script>
    <script src="js/configuracoes.js?v=2"></script>
    <script src="js/cadastros.js?v=2"></script>
    <script src="js/solicitacoes.js?v=2"></script>
    <script src="js/saas-master.js?v=2"></script>
    <script src="js/os-kanban.js?v=2"></script>
    <script src="js/os-execucao.js?v=2"></script>
</body>
</html>
