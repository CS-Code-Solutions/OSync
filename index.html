<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Service - Dashboard Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Script do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex h-screen overflow-hidden text-sm">

    <!-- Menu Lateral -->
    <aside class="w-64 bg-white shadow-md flex flex-col">
        <div class="p-4 border-b flex items-center justify-center">
            <h1 class="font-bold text-lg text-purple-600">MANAGER SERVICE</h1>
        </div>
        <nav class="flex-1 overflow-y-auto p-4 space-y-2">
            <a href="index.html" class="block p-2 rounded bg-purple-100 text-purple-700 font-semibold">Painel (Kanban)</a>
            <a href="maquinas.html" class="block p-2 rounded text-gray-600 hover:bg-gray-50">Máquinas</a>
            <a href="solicitacoes.html" class="block p-2 rounded text-gray-600 hover:bg-gray-50">Solicitações</a>
            <a href="cadastros.html" class="block p-2 rounded text-gray-600 hover:bg-gray-50">Cadastros Base</a>
            <a href="relatorios.html" class="block p-2 rounded text-gray-600 hover:bg-gray-50">Relatórios</a>
            <a href="usuarios.html" class="block p-2 rounded text-gray-600 hover:bg-gray-50">Usuários / Perfis</a>
        </nav>
        <div class="p-4 border-t">
            <a href="login.html" class="text-red-500 hover:underline">Sair</a>
        </div>
    </aside>

    <!-- Área Principal (Quadro Kanban) -->
    <main class="flex-1 flex flex-col h-full">
        <!-- Cabeçalho -->
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <h2 class="text-xl font-semibold text-gray-800">Ordens de Serviço</h2>
            <button class="bg-purple-600 text-white px-4 py-2 rounded shadow hover:bg-purple-700 transition">
                + Nova O.S.
            </button>
        </header>

        <!-- Colunas do Kanban -->
        <div class="flex-1 p-6 overflow-x-auto">
            <div class="flex space-x-4 h-full min-w-max">
                
                <!-- Coluna: Aberta -->
                <div class="w-80 bg-gray-50 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="p-3 border-b border-gray-200 bg-gray-100 rounded-t-lg font-bold text-gray-700">
                        Aberto (2)
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3" id="col-aberta">
                        <!-- Card de Exemplo -->
                        <div class="bg-white p-3 rounded shadow-sm border-l-4 border-green-500 cursor-move">
                            <div class="text-xs text-gray-500 mb-1">O.S: 118369</div>
                            <div class="font-bold text-gray-800">CM-034 - DAF XF FTT 530</div>
                            <div class="text-sm text-gray-600 mt-2">Corretiva por Inspeção</div>
                        </div>
                    </div>
                </div>

                <!-- Coluna: Em Andamento -->
                <div class="w-80 bg-gray-50 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="p-3 border-b border-gray-200 bg-gray-100 rounded-t-lg font-bold text-blue-700">
                        Em Andamento (1)
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3" id="col-andamento">
                        <!-- Card virá do Supabase -->
                    </div>
                </div>

                <!-- Coluna: Aguardando Peça -->
                <div class="w-80 bg-gray-50 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="p-3 border-b border-gray-200 bg-gray-100 rounded-t-lg font-bold text-orange-600">
                        Aguardando Peça (0)
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3" id="col-aguardando">
                    </div>
                </div>

                <!-- Coluna: Concluída -->
                <div class="w-80 bg-gray-50 rounded-lg shadow-sm border border-gray-200 flex flex-col">
                    <div class="p-3 border-b border-gray-200 bg-gray-100 rounded-t-lg font-bold text-gray-500">
                        Concluída (0)
                    </div>
                    <div class="p-3 flex-1 overflow-y-auto space-y-3" id="col-concluida">
                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Script de Inicialização da Base de Dados -->
    <script>
        // A lógica de conexão com o Supabase e o Drag and Drop será inserida aqui
        console.log("Interface Kanban carregada.");
    </script>
</body>
</html>
